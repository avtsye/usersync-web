name: Process LRC
on:
  workflow_dispatch:
    inputs:
      release_id:
        required: true
      job_ref:
        required: true
      has_lyrics:
        required: true
        default: false
        type: boolean
      model:
        required: true
        default: large-v3-turbo
        type: choice
        options: [small, medium, large-v3-turbo, large-v3]
      language:
        required: true
        default: he
      enhanced:
        required: true
        default: true
        type: boolean
permissions:
  contents: write
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout temporary job branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.job_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r requirements.txt
      - name: Generate LRC
        shell: bash
        run: |
          EXTRA=""
          if [ -f job/lyrics.txt ] && [ -s job/lyrics.txt ]; then EXTRA="--lyrics job/lyrics.txt"; fi
          python scripts/process.py --audio job/audio $EXTRA --output result.lrc --language "${{ inputs.language }}" --model "${{ inputs.model }}" ${{ inputs.enhanced && '--enhanced' || '' }}
      - name: Upload result
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          UPLOAD_URL=$(gh api "/repos/${{ github.repository }}/releases/$RELEASE_ID" --jq '.upload_url' | sed 's/{?name,label}//')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/octet-stream" --data-binary @result.lrc "$UPLOAD_URL?name=result.lrc"
      - name: Mark failed job
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          echo "העיבוד נכשל ב-GitHub Actions. פתח את לשונית Actions במאגר כדי לראות את השגיאה המלאה." > error.txt
          UPLOAD_URL=$(gh api "/repos/${{ github.repository }}/releases/$RELEASE_ID" --jq '.upload_url' | sed 's/{?name,label}//')
          curl -fsSL -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: text/plain; charset=utf-8" --data-binary @error.txt "$UPLOAD_URL?name=error.txt" || true
      - name: Delete temporary job branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_REF: ${{ inputs.job_ref }}
        run: |
          REF_NAME="${JOB_REF#refs/heads/}"
          gh api -X DELETE "/repos/${{ github.repository }}/git/refs/heads/$REF_NAME" || true
